<style>
/* Layout: full-bleed canvas. One solid rounded control slab on the right, scene switcher top-left,
   field notes bottom-left, shortcut pill bottom-centre. Chunky filled rows instead of thin lines. */
:root {
  --canvas: #f3f3f5;
  --surface: #ffffff;
  --well: #f0f0f3;
  --well-2: #e5e5eb;
  --fill: #d6d6df;
  --chip: #ffffff;
  --text: #111115;
  --muted: #62626d;
  --faint: #6f6f7a;
  --line: rgba(17, 17, 30, 0.08);
  --inv: #111115;
  --inv-text: #ffffff;
  --inv-kbd: rgba(255, 255, 255, 0.16);
  --shadow: 0 18px 48px -18px rgba(20, 20, 45, 0.3), 0 0 0 1px rgba(17, 17, 30, 0.07);
  --chip-shadow: 0 1px 2px rgba(17, 17, 30, 0.14), 0 0 0 1px rgba(17, 17, 30, 0.05);
  --accent: #5a2fd6;
  --accent-2: #b98cff;
  --rec: #d92d3a;
  --f-ui: 'Geist', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --f-math: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --r-xl: 22px;
  --r-md: 12px;
  --gut: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #07060d; --surface: #18181b; --well: #242428; --well-2: #2f2f35; --fill: #3e3e46; --chip: #3a3a41;
    --text: #f4f4f6; --muted: #a3a3ad; --faint: #8f8f99; --line: rgba(255, 255, 255, 0.07);
    --inv: #f4f4f6; --inv-text: #111114; --inv-kbd: rgba(0, 0, 0, 0.1);
    --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.07);
    --chip-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    --rec: #ff6b74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #07060d; --surface: #18181b; --well: #242428; --well-2: #2f2f35; --fill: #3e3e46; --chip: #3a3a41;
  --text: #f4f4f6; --muted: #a3a3ad; --faint: #8f8f99; --line: rgba(255, 255, 255, 0.07);
  --inv: #f4f4f6; --inv-text: #111114; --inv-kbd: rgba(0, 0, 0, 0.1);
  --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.07);
  --chip-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  --rec: #ff6b74;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--text);
  font: 500 13px/1.4 var(--f-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.k {
  font: 500 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 5px;
  background: var(--well-2); color: var(--muted); display: inline-block; min-width: 9px; text-align: center;
}
.slab { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow); }

/* Scene switcher */
.scenes {
  position: fixed;
  top: calc(var(--gut) + env(safe-area-inset-top, 0px));
  left: var(--gut);
  display: flex; gap: 2px; padding: 4px;
  border-radius: 16px;
  max-width: calc(100% - 2 * var(--gut));
  overflow-x: auto; scrollbar-width: none;
}
.scenes::-webkit-scrollbar { display: none; }
.scenes button {
  flex: 0 0 auto; border: 0; background: transparent;
  padding: 9px 14px; border-radius: 12px;
  color: var(--muted); font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background .18s, color .18s;
}
.scenes button:hover { color: var(--text); background: var(--well); }
.scenes button[aria-selected="true"] { background: var(--inv); color: var(--inv-text); }
.scenes button[aria-selected="true"] .k { background: var(--inv-kbd); color: inherit; opacity: .7; }

/* Panel */
.panel {
  position: fixed;
  top: calc(var(--gut) + env(safe-area-inset-top, 0px));
  right: var(--gut);
  width: 328px;
  max-height: calc(100% - 2 * var(--gut) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; overflow: hidden;
}
.ph { display: flex; align-items: center; gap: 0; padding: 14px 10px 10px 16px; }
.logo { flex: 1; font: 700 17px/1 var(--f-ui); letter-spacing: -0.02em; }
.logo { display: flex; align-items: center; gap: 9px; min-width: 0; white-space: nowrap; }
.logo .mark { width: 22px; height: 22px; flex: 0 0 auto; }
.ib {
  width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent;
  display: grid; place-items: center; color: var(--muted);
  transition: background .15s, color .15s;
}
.ib:hover { background: var(--well); color: var(--text); }
.ib svg { width: 17px; height: 17px; }
.ib[aria-pressed="false"] .on, .ib[aria-pressed="true"] .off { display: none; }
.pscroll > * { flex-shrink: 0; }
.pscroll { overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: var(--fill) transparent; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.selwrap { position: relative; min-width: 0; }
.selwrap select {
  width: 100%; appearance: none; -webkit-appearance: none;
  background: var(--well); border: 0; border-radius: var(--r-md);
  padding: 0 34px 0 14px; height: 40px; font-weight: 500; font-size: 13px;
  text-overflow: ellipsis;
}
.selwrap::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -6px;
  border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); pointer-events: none;
}
.selwrap select option, .selwrap select optgroup { background: var(--surface); color: var(--text); }
.pill {
  height: 40px; border: 0; border-radius: var(--r-md); background: var(--well);
  padding: 0 14px; font-weight: 500; font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, color .15s, transform .08s;
}
.pill:hover { background: var(--well-2); color: var(--text); }
.pill:active, .cta:active { transform: scale(0.985); }
.pill[aria-pressed="true"] { background: var(--well-2); color: var(--text); }
.pill.rec { color: var(--rec); }
.cta {
  height: 46px; border: 0; border-radius: 14px; width: 100%;
  background: var(--inv); color: var(--inv-text); font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s, opacity .15s;
}
.cta:hover { opacity: .92; }
.cta .k { background: var(--inv-kbd); color: inherit; opacity: .75; }
.cta .xdim { font: 500 12px/1 var(--f-mono); opacity: .6; font-variant-numeric: tabular-nums; }
a.pill { text-decoration: none; }
.recwrap { display: flex; gap: 4px; min-width: 0; }
.recwrap .pill { flex: 1; min-width: 0; padding: 0 10px; }
.selwrap.mini { flex: 0 0 62px; }
.selwrap.mini select { padding: 0 22px 0 10px; color: var(--rec); font-weight: 600; }
.selwrap.mini::after { right: 10px; width: 6px; height: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rule { height: 1px; background: var(--line); margin: 6px 2px; border: 0; }

details.sec { border-top: 1px solid var(--line); margin-top: 4px; }
details.sec > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 4px 10px; font-weight: 650; font-size: 14px; letter-spacing: -0.01em;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary svg { width: 12px; height: 12px; color: var(--faint); transition: transform .2s; }
details.sec[open] > summary svg { transform: rotate(90deg); }
.sbody { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }

/* Full-row slider */
.sl {
  position: relative; height: 38px; border-radius: var(--r-md); background: var(--well);
  overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
  --p: 50%;
}
.sl .fill { position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--fill); }
.sl label, .sl output { position: relative; z-index: 1; pointer-events: none; font-size: 13px; }
.sl label { color: var(--text); font-weight: 500; white-space: nowrap; }
.sl output { font: 500 12.5px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--text); }
.sl input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; z-index: 2; }
.sl:has(input:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }
.sl:hover .fill { filter: brightness(1.04); }

/* Segmented row */
.seg {
  display: flex; align-items: center; gap: 10px;
  background: var(--well); border-radius: var(--r-md); padding: 3px 3px 3px 14px; min-height: 38px;
}
.seg.bare { padding-left: 3px; }
.seg .lbl { color: var(--text); font-size: 13px; white-space: nowrap; flex: 0 0 auto; }
.segs { flex: 1; display: flex; gap: 2px; min-width: 0; }
.segs button {
  flex: 1 1 0; min-width: 0; height: 32px; border: 0; border-radius: 9px; background: transparent;
  color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .15s, color .15s, box-shadow .15s;
}
.segs button:hover { color: var(--text); }
.segs button[aria-pressed="true"] { background: var(--chip); color: var(--text); box-shadow: var(--chip-shadow); font-weight: 600; }

/* Toggle row */
.tg { display: flex; align-items: center; justify-content: space-between; background: var(--well); border-radius: var(--r-md); height: 38px; padding: 0 8px 0 14px; }
.switch { width: 40px; height: 24px; border-radius: 999px; border: 0; background: var(--fill); position: relative; padding: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
.switch[aria-checked="true"] { background: var(--inv); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--inv-text); }

/* Cards */
.card { background: var(--well); border-radius: var(--r-md); padding: 6px 8px 6px 14px; }
.card-h { display: flex; justify-content: space-between; align-items: center; height: 30px; padding-right: 6px; }
.card-h span:last-child { color: var(--faint); font: 400 12px/1 var(--f-mono); }
.crow { display: grid; grid-template-columns: 1fr auto 26px; align-items: center; gap: 10px; height: 34px; }
.crow .hex { font: 500 12px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; }
.crow .chip { position: relative; width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(128,128,140,.25); }
.crow .chip input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.crow .chip:has(input:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }
.selrow { display: flex; align-items: center; justify-content: space-between; background: var(--well); border-radius: var(--r-md); height: 38px; padding-left: 14px; }
.selrow .selwrap select { background: transparent; text-align: right; text-align-last: right; height: 38px; font-weight: 500; color: var(--muted); padding-right: 32px; }

/* Harmonics */
.eqcard { background: var(--well); border-radius: var(--r-md); padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.eqcard .card-h { height: auto; padding: 0 2px; }
.eqcard .card-h span:first-child { font-size: 13px; }
.eqcard .card-h em { font: italic 400 15px/1 var(--f-math); color: var(--faint); }
.eq { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; height: 92px; touch-action: none; cursor: ns-resize; user-select: none; }
.eq .bar { position: relative; border-radius: 8px; background: var(--well-2); overflow: hidden; }
.eq .bar i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; background: linear-gradient(to top, var(--accent), var(--accent-2)); transition: height .06s linear; }
.eq .bar.hit i { filter: brightness(1.25); }
.eqn { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; text-align: center; font: 500 11px/1 var(--f-mono); color: var(--faint); }
.byline { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 12.5px/1 var(--f-ui); letter-spacing: 0; color: var(--muted); text-decoration: none; margin-left: -2px; padding-top: 2px; }
.byline:hover { color: var(--text); text-decoration: underline; }
.stat { font: 500 11px/1.3 var(--f-mono); color: var(--faint); padding: 4px 4px 0; display: flex; justify-content: space-between; }

/* Field notes */
.notes {
  position: fixed;
  left: var(--gut);
  bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px));
  width: min(380px, calc(100% - 2 * var(--gut)));
  padding: 16px 16px 18px 18px;
}
.ntop { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.notes h2 { margin: 0; font: 700 19px/1.15 var(--f-ui); letter-spacing: -0.02em; text-wrap: balance; }
.eqn-chip { margin: 12px 0 10px; padding: 9px 12px; border-radius: var(--r-md); background: var(--well); font: italic 400 17px/1.3 var(--f-math); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.eqn-chip sub, .eqn-chip sup { font-size: .68em; }
.notes p { margin: 0; color: var(--muted); font-weight: 400; font-size: 13px; line-height: 1.5; max-width: 62ch; }
.notes p + p { margin-top: 8px; }
.notes p b { color: var(--text); font-weight: 600; }
.notes.collapsed .nbody { display: none; }
.notes .ib svg { transition: transform .2s; }
.notes.collapsed .ib svg { transform: rotate(180deg); }

/* Shortcut pill */
.hints {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; padding: 6px 8px; border-radius: 16px;
  color: var(--muted); font-size: 12.5px; white-space: nowrap;
}
.hints span { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; }
.hints span + span { border-left: 1px solid var(--line); }

.fab {
  position: fixed; right: var(--gut); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px));
  height: 44px; padding: 0 18px; border: 0; border-radius: 14px; font-weight: 600; z-index: 4;
  background: var(--inv); color: var(--inv-text); box-shadow: var(--shadow);
}
.paused-tag {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(var(--gut) + env(safe-area-inset-top, 0px));
  font: 600 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase;
  padding: 9px 12px; border-radius: 12px; color: var(--text);
}

/* Modal + toast */
.modal { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--gut); background: rgba(8, 8, 14, .45); z-index: 10; }
.mcard { width: min(760px, 100%); padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 100%; }
.media { min-height: 0; display: grid; place-items: center; border-radius: 14px; overflow: hidden; background: var(--well); }
.media img, .media video { display: block; max-width: 100%; max-height: 62vh; }
.media textarea { width: 100%; height: 280px; resize: vertical; background: var(--well); color: var(--text); border: 0; border-radius: 14px; padding: 12px; font: 400 12px/1.5 var(--f-mono); box-sizing: border-box; }
.mfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mfoot p { margin: 0; color: var(--muted); flex: 1 1 220px; font-weight: 400; }
.mfoot .btns { display: flex; gap: 6px; }
.mfoot .cta { width: auto; padding: 0 20px; height: 40px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); padding: 11px 16px; border-radius: 14px; font-weight: 600; z-index: 11; }

.panel.closed { display: none; }
/* Focus mode: only the canvas. A small button fades in when the pointer moves. */
.zen-bar { display: none; position: fixed; right: var(--gut); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); z-index: 6; gap: 8px; opacity: 0; transition: opacity .3s; }
.zen-btn { border: 0; height: 40px; padding: 0 14px; font-weight: 600; color: var(--text); display: inline-flex; gap: 8px; align-items: center; }
:root.zen .scenes, :root.zen .panel, :root.zen .notes, :root.zen .hints, :root.zen .fab, :root.zen .paused-tag { display: none !important; }
:root.zen .zen-bar { display: flex; }
:root.zen.zen-awake .zen-bar { opacity: 1; }
:root.zen.zen-idle #gl { cursor: none; }

@media (max-width: 1599px) { .hints { display: none; } }
@media (max-width: 1100px) { .paused-tag { top: calc(72px + env(safe-area-inset-top, 0px)); left: var(--gut); transform: none; } }
@media (max-width: 720px) {
  .panel {
    top: auto; left: 8px; right: 8px; width: auto;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    max-height: 62%; z-index: 5;
  }
  .scenes button .k { display: none; }
  .scenes button { padding: 9px 12px; }
  .notes { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ================================================================== audio */
// One AudioContext for the interface sounds. Everything is synthesized.

const AudioHub = (() => {
  let ctx = null;
  return {
    // Opening the audio device is a blocking call, so it never runs inside a click or while the page
    // is just animating. It runs once, right after the first interaction has painted (see below);
    // later clicks only resume the open context, which is asynchronous.
    warm() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ctx = new AC({ latencyHint: 'interactive' }); } catch { ctx = null; }
    },
    get() {
      if (!ctx) return null;
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    },
  };
})();
function openAudioAfterFirstInput() {
  removeEventListener('pointerdown', openAudioAfterFirstInput, true);
  removeEventListener('keydown', openAudioAfterFirstInput, true);
  if (!Sound.on) return;
  requestAnimationFrame(() => setTimeout(() => {
    AudioHub.warm();
    const idle = window.requestIdleCallback || (f => setTimeout(f, 100));
    idle(() => Sound.prewarm());
  }, 0));
}
addEventListener('pointerdown', openAudioAfterFirstInput, true);
addEventListener('keydown', openAudioAfterFirstInput, true);
function readPref(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v === '1'; } catch { return d; } }
function writePref(k, v) { try { localStorage.setItem(k, v ? '1' : '0'); } catch {} }

// Karplus–Strong plucked string, rendered once per pitch and cached.
const ksCache = new Map();
function ksBuffer(c, freq, bright = 0.55, seconds = 1.3) {
  const key = Math.round(freq * 10) + ':' + bright + ':' + seconds;
  let buf = ksCache.get(key);
  if (buf) return buf;
  const sr = c.sampleRate, len = (sr * seconds) | 0, N = Math.max(2, Math.round(sr / freq));
  buf = c.createBuffer(1, len, sr);
  const y = buf.getChannelData(0);
  for (let i = 0; i < N; i++) y[i] = Math.random() * 2 - 1;
  for (let i = 1; i < N; i++) y[i] = y[i] * bright + y[i - 1] * (1 - bright);
  const decay = freq > 600 ? 0.992 : 0.996;
  y[N] = decay * y[0];
  for (let i = N + 1; i < len; i++) y[i] = decay * 0.5 * (y[i - N] + y[i - N - 1]);
  let m = 0; for (let i = 0; i < len; i++) m = Math.max(m, Math.abs(y[i]));
  const k = m > 0 ? 1 / m : 1;
  for (let i = 0; i < len; i++) y[i] *= k * Math.min(1, (len - i) / (sr * 0.2));
  if (ksCache.size > 120) ksCache.clear();
  ksCache.set(key, buf);
  return buf;
}

const Sound = (() => {
  let out = null, noiseBuf = null, lastTick = 0, lastBucket = -1;
  let enabled = readPref('worldsheet.sound', true);

  function ac() {
    if (!enabled) return null;
    const c = AudioHub.get();
    if (!c) return null;
    if (!out) {
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5;
      out = c.createGain(); out.gain.value = 0.6;
      out.connect(comp); comp.connect(c.destination);
    }
    return c;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(freq, { type = 'sine', peak = .06, a = .003, d = .06, delay = 0, glide = 0 } = {}) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, t + a + d);
    env(g, t, a, peak, d);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + a + d + .03);
  }
  function click(peak = .05, freq = 3000, q = 1.2, d = .025, delay = 0) {
    const c = ac(); if (!c) return;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, (c.sampleRate * .06) | 0, c.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); env(g, t, .001, peak, d);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + d + .03);
  }
  function pluck(freq, peak = .2, delay = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = ksBuffer(c, freq);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 4800;
    const g = c.createGain(); g.gain.value = peak;
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t);
  }

  return {
    get on() { return enabled; },
    set(v) {
      enabled = v;
      writePref('worldsheet.sound', v);
      if (v) {
        if (!AudioHub.get()) { requestAnimationFrame(() => setTimeout(() => { AudioHub.warm(); this.prewarm(); }, 0)); return; }
        this.prewarm(); tone(660, { peak: .05, d: .07 }); tone(990, { peak: .04, d: .09, delay: .06 }); }
    },
    tick(fr) {
      const now = performance.now();
      const b = Math.round(fr * 48);
      if (b === lastBucket || now - lastTick < 26) return;
      lastTick = now; lastBucket = b;
      tone(360 + fr * 720, { type: 'triangle', peak: .03, d: .028 });
      click(.018, 2200 + fr * 2400, 2.2, .012);
    },
    press() { click(.07, 1700, .9, .03); tone(540, { peak: .035, d: .05, glide: .72 }); },
    toggle(on) { tone(on ? 620 : 470, { peak: .05, d: .05 }); tone(on ? 930 : 350, { peak: .04, d: .08, delay: .05 }); },
    seg(i) { tone(392 * Math.pow(2, (i * 4) / 12), { type: 'triangle', peak: .05, d: .07 }); click(.03, 2600, 1.5, .015); },
    section(open) { tone(open ? 280 : 340, { peak: .045, d: .07, glide: open ? 1.5 : .66 }); },
    harmonic(n, amp, root) { pluck(root * n, .07 + amp * .22, 0); },
    scene(root, amps) {
      pluck(root, .24, 0);
      amps.forEach((a, k) => { if (k && a > .2) pluck(root * (k + 1), a * .1, .025 * k); });
    },
    chord(amps, root) {
      let d = 0;
      amps.forEach((a, k) => { if (a > .12) { pluck(root * (k + 1), .06 + a * .15, d); d += .05; } });
    },
    shutter() { click(.13, 1300, .7, .05); click(.08, 3800, 1, .03, .075); },
    rec() { tone(880, { peak: .05, d: .08 }); tone(880, { peak: .05, d: .08, delay: .14 }); },
    // Render every string pitch the UI can play (8 harmonics of 4 scene roots) in small idle slices.
    prewarm() {
      if (!enabled) return;
      const c = AudioHub.get(); if (!c) return;
      const todo = [];
      for (const r of [98, 130.81, 110, 146.83]) for (let n = 1; n <= 8; n++) todo.push(r * n);
      const idle = window.requestIdleCallback || (f => setTimeout(() => f({ timeRemaining: () => 8 }), 50));
      const work = dl => { while (todo.length && dl.timeRemaining() > 3) ksBuffer(c, todo.shift()); if (todo.length) idle(work); };
      idle(work);
    },
  };
})();

/* ================================================================== shaders */

const GLSL_COMMON = /* glsl */`
#define TAU 6.28318530718
#define PI 3.14159265359
float hash1(float n){ n = fract(n*0.1031); n *= n + 33.33; n *= n + n; return fract(n); }
float hash2(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash2(i), hash2(i+vec2(1,0)), u.x), mix(hash2(i+vec2(0,1)), hash2(i+vec2(1,1)), u.x), u.y);
}
float vnoiseP(vec2 p, vec2 P){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float x0 = P.x > 0.0 ? mod(i.x, P.x) : i.x, x1 = P.x > 0.0 ? mod(i.x + 1.0, P.x) : i.x + 1.0;
  float y0 = P.y > 0.0 ? mod(i.y, P.y) : i.y, y1 = P.y > 0.0 ? mod(i.y + 1.0, P.y) : i.y + 1.0;
  return mix(mix(hash2(vec2(x0, y0)), hash2(vec2(x1, y0)), u.x), mix(hash2(vec2(x0, y1)), hash2(vec2(x1, y1)), u.x), u.y);
}
float fbmP(vec2 p, vec2 P){
  float a = 0.5, s = 0.0;
  for(int i=0;i<4;i++){ s += a*vnoiseP(p, P); p = p*2.0 + vec2(1.7, 9.2); P *= 2.0; a *= 0.5; }
  return s;
}
float fbm(vec2 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return s;
}
`;

const CLOSED_GLSL = /* glsl */`
// Closed string X(sigma, tau) with exact tangents dX/dsigma and dX/dtau (left- and right-movers).
void closed(float sig, float tau, out vec3 X, out vec3 dS, out vec3 dT){
  vec3 rad = vec3(cos(sig), 0.0, sin(sig)), drad = vec3(-sin(sig), 0.0, cos(sig));
  X = rad*uRadius; dS = drad*uRadius; dT = vec3(0.0);
  for(int i=0;i<8;i++){
    if(uAmp[i] <= 0.0) continue;
    float n = float(i+1);
    float a = uAmp[i]*uAmpScale*inversesqrt(n)*0.55;
    float aL = n*(sig - tau) + uPhase[i], aR = n*(sig + tau) + uPhase[i]*1.73 + 1.1;
    float L = cos(aL), R = cos(aR), sL = sin(aL), sR = sin(aR);
    X  += a*(vec3(0.0, L, 0.0) + rad*R*0.7);
    dS += a*(vec3(0.0, -n*sL, 0.0) + drad*R*0.7 - rad*n*sR*0.7);
    dT += a*(vec3(0.0, n*sL, 0.0) - rad*n*sR*0.7);
  }
}
`;

const VERT = /* glsl */`
uniform float uTau, uTrail, uSpread, uRadius, uAmpScale, uFade, uHeight;
uniform float uAmp[8];
uniform float uPhase[8];
uniform float uGap, uBrane, uFlip, uTopo, uCYn, uCYa, uCYr, uScale;
attribute float aInst;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vV;
varying float vA;
varying float vInst;
varying float vT;
varying vec3 vPos;
${GLSL_COMMON}

vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
${CLOSED_GLSL}
vec2 cpow(vec2 w, float p){ float r = length(w); if(r < 1e-5) return vec2(0.0); float a = atan(w.y, w.x); return pow(r, p)*vec2(cos(p*a), sin(p*a)); }

vec3 surf(vec2 uv){
  vec3 p = vec3(0.0);
#if SCENE == 0
  float sig = uv.x*TAU;
  float tau = uTau - (1.0 - uv.y)*uTrail;
  vec3 rad = vec3(cos(sig), 0.0, sin(sig));
  p = rad*uRadius;
  for(int i=0;i<8;i++){
    if(uAmp[i] <= 0.0) continue;
    float n = float(i+1);
    float a = uAmp[i]*uAmpScale*inversesqrt(n)*0.55;
    float L = cos(n*(sig - tau) + uPhase[i]);
    float R = cos(n*(sig + tau) + uPhase[i]*1.73 + 1.1);
    p += a*(vec3(0.0, 1.0, 0.0)*L + rad*R*0.7);
  }
  p.y += (uv.y - 0.5)*uSpread*uHeight;
#elif SCENE == 1
  float k = aInst;
  float sig = uv.x*PI;
  float tau = uTau + k*0.913 - (1.0 - uv.y)*uTrail;
  float Lx = uGap*0.5;
  float h1 = hash1(k + 1.0), h2 = hash1(k*3.1 + 2.0), h3 = hash1(k*7.7 + 5.0), h4 = hash1(k*11.3 + 9.0);
  vec2 A = (vec2(h1, h2) - 0.5)*uBrane*1.5;
  vec2 B = A + (vec2(h3, h4) - 0.5)*uBrane*0.9;
  if(mod(k, 3.0) > 1.5){
    float side = h3 > 0.5 ? 1.0 : -1.0;
    p = vec3(side*(Lx - sin(sig)*Lx*(0.35 + 0.45*h1)), mix(A.x, B.x, uv.x), mix(A.y, B.y, uv.x));
  } else {
    p = vec3(mix(-Lx, Lx, uv.x), mix(A.x, B.x, uv.x), mix(A.y, B.y, uv.x));
  }
  for(int i=0;i<8;i++){
    if(uAmp[i] <= 0.0) continue;
    float n = float(i+1);
    float a = uAmp[i]*uAmpScale*inversesqrt(n)*0.42;
    float ph = uPhase[i] + k*2.399*n;
    p.y += a*cos(n*sig)*cos(n*tau + ph);
    p.z += a*cos(n*sig)*sin(n*tau + ph*1.31);
    p.x += a*sin(n*sig)*cos(n*tau + ph*0.7)*0.6;
  }
#elif SCENE == 2
  float th = uv.x*TAU;
  float ripple = 0.0;
  for(int i=0;i<8;i++){
    if(uAmp[i] <= 0.0) continue;
    float n = float(i+1);
    ripple += uAmp[i]*uAmpScale*inversesqrt(n)*0.07*cos(n*th + n*uTau*0.6 + uPhase[i] + uv.y*n*(uTopo > 0.5 ? TAU : 3.0));
  }
  if(uTopo < 0.5){
    float v = uFlip > 0.5 ? 1.0 - uv.y : uv.y;
    float t1 = smoothstep(0.1, 0.5, v);
    float t2 = smoothstep(0.5, 0.97, v);
    float R0 = uRadius;
    float rho = R0*0.6;
    float c = cos(th);
    float side = c >= 0.0 ? 1.0 : -1.0;
    vec2 circ = R0*vec2(cos(th), sin(th));
    vec2 fig = side*vec2(rho + rho*cos(2.0*th), rho*sin(2.0*th));
    vec2 q = mix(circ, fig, t1);
    float sep = t2*R0*1.05 + t2*t2*R0*0.3;
    vec2 ctr = vec2(side*(rho + sep), 0.0);
    q.x += side*sep;
    q = ctr + (q - ctr)*(1.0 - 0.18*t2);
    q *= 1.0 + ripple;
    p = vec3(q.x, (v - 0.5)*uHeight, q.y);
  } else {
    float ph = uv.y*TAU;
    float r = uRadius*0.55*(1.0 + ripple*1.5);
    float Rt = uRadius*1.45;
    p = vec3((Rt + r*cos(th))*cos(ph), r*sin(th), (Rt + r*cos(th))*sin(ph));
  }
#else
  float n = uCYn;
  float k2 = floor((aInst + 0.5)/n);
  float k1 = aInst - k2*n;
  float x = uv.x*PI*0.5;
  // Same outer radius for every degree: cosh(Y)^(2/n) matches the quintic's cosh(reach)^(2/5).
  float Yn = acosh(pow(cosh(uCYr), n/5.0));
  float y = (uv.y*2.0 - 1.0)*Yn;
  vec2 cu = vec2(cos(x)*cosh(y), -sin(x)*sinh(y));
  vec2 su = vec2(sin(x)*cosh(y),  cos(x)*sinh(y));
  float a1 = TAU*k1/n, a2 = TAU*k2/n;
  vec2 z1 = cmul(vec2(cos(a1), sin(a1)), cpow(cu, 2.0/n));
  vec2 z2 = cmul(vec2(cos(a2), sin(a2)), cpow(su, 2.0/n));
  float ca = cos(uCYa), sa = sin(uCYa);
  p = vec3(z1.x, ca*z1.y + sa*z2.y, z2.x)*1.25;
#endif
  return p*uScale;
}

void main(){
  vec2 st = uv;
#if SCENE == 0
  // Exact worldsheet tangents from the mode sum: no extra evaluations and no noise.
  vec3 X, dS, dT;
  closed(st.x*TAU, uTau - (1.0 - st.y)*uTrail, X, dS, dT);
  vec3 p = (X + vec3(0.0, (st.y - 0.5)*uSpread*uHeight, 0.0))*uScale;
  vec3 dx = dS*TAU*uScale;
  vec3 dy = (dT*uTrail + vec3(0.0, uSpread*uHeight, 0.0))*uScale;
#else
  vec3 p = surf(st);
  // One-sided differences that step into the patch: 3 surface evaluations instead of 5,
  // and never across a patch edge or branch cut.
  float e = 0.004;
  float ex = st.x + e <= 1.0 ? e : -e, ey = st.y + e <= 1.0 ? e : -e;
  vec3 dx = (surf(st + vec2(ex, 0.0)) - p)/ex;
  vec3 dy = (surf(st + vec2(0.0, ey)) - p)/ey;
#endif
  vec3 Vw = cameraPosition - p;
  vec3 n = cross(dx, dy);
  if(dot(n, n) < 1e-8){
    vec3 T = normalize(dx + 1e-6);
    vec3 Vn = normalize(Vw);
    n = Vn - T*dot(Vn, T) + 1e-5;
  }
  vN = n*inversesqrt(max(dot(n, n), 1e-12));
  vV = Vw;
  vPos = p;
  vUv = st;
  vInst = aInst;
  vT = 0.0;
  float a = 1.0;
#if SCENE == 0 || SCENE == 1
  a = pow(st.y, uFade)*smoothstep(0.0, 0.03, st.y);
#if SCENE == 0
  a *= 1.0 - 0.6*smoothstep(0.965, 1.0, st.y);   // soft hand-off to the bright present-moment tube
#endif
  vT = SCENE == 1 ? st.y : 0.0;   // the closed string's present moment is drawn as its own tube
#endif
#if SCENE == 2
  if(uTopo < 0.5){
    float v = uFlip > 0.5 ? 1.0 - st.y : st.y;
    float c = abs(cos(st.x*TAU));
    float t2 = smoothstep(0.5, 0.53, v);
    a *= 1.0 - t2*(1.0 - smoothstep(0.03, 0.2, c));
    a *= smoothstep(0.0, 0.06, st.y)*smoothstep(1.0, 0.94, st.y);
  }
#endif
  vA = a;
  gl_Position = projectionMatrix*viewMatrix*vec4(p, 1.0);
}
`;

const FRAG = /* glsl */`
uniform vec3 uC0, uC1, uC2, uC3, uC4;
uniform float uTopo;
uniform float uStyle, uStreaks, uDensity, uGlow, uIrid, uAccent, uOpacity, uInk, uTimeF, uHead, uGridN, uNorm, uPxScale;
varying vec2 vUv;
varying vec3 vN;
varying vec3 vV;
varying float vA;
varying float vInst;
varying float vT;
varying vec3 vPos;
${GLSL_COMMON}
vec3 film(float t){ return 0.5 + 0.5*cos(TAU*(t + vec3(0.0, 0.33, 0.67))); }

void main(){
  if(vA < 0.004) discard;
  // Guarded normalisation and a clamped dot product: rounding can push |N·V| past 1,
  // and pow() of a negative base is NaN, which bloom would smear across the whole frame.
  vec3 N = vN*inversesqrt(max(dot(vN, vN), 1e-12));
  vec3 V = vV*inversesqrt(max(dot(vV, vV), 1e-12));
  float ndv = clamp(abs(dot(N, V)), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 1.5);
#if SCENE == 3
  vec2 tuv = vec2(vPos.x*0.21 + vPos.z*0.13 + 0.5, vPos.y*0.21 - vPos.z*0.08 + 0.5);
  float so = 0.0;
#else
  vec2 tuv = vUv;
  float so = vInst*17.31;
#endif
  // Around the closed loop sigma wraps, so every texture repeats seamlessly in u (no seam where it closes).
  float PW = SCENE == 3 ? 0.0 : 1.0;
  float PY = SCENE == 2 ? step(0.5, uTopo) : 0.0;   // the torus also wraps around its ring

  vec3 col = mix(uC0, uC1, smoothstep(0.1, 1.0, fres));
  float n1 = vnoiseP(vec2(tuv.x*4.0 + so, tuv.y*2.0 + uTimeF*0.08), vec2(4.0*PW, 2.0*PY));
  float n2 = vnoiseP(vec2(tuv.x*3.0 - 5.3 + so, tuv.y*3.0 - uTimeF*0.06), vec2(3.0*PW, 3.0*PY));
  col = mix(col, uC2, smoothstep(0.5, 0.85, n1)*uAccent);
  col = mix(col, uC3, smoothstep(0.58, 0.9, n2)*uAccent);
  col = mix(col, uC4, smoothstep(0.55, 1.0, fres*n1*1.4)*uAccent);

  float I = 0.16 + fres*uGlow;
  int st = int(uStyle + 0.5);
  if(st == 0){
    float s = vnoiseP(vec2(tuv.x*uDensity + so, tuv.y*1.0 - uTimeF*0.12), vec2(uDensity*PW, PY));
    float s2 = vnoiseP(vec2(tuv.x*uDensity*3.0 + 31.0 + so, tuv.y*2.0), vec2(uDensity*3.0*PW, 2.0*PY));
    s = pow(s, 2.4)*1.6 + pow(s2, 4.0)*1.4;
    I *= mix(1.0, 0.2 + s, uStreaks);
  } else if(st == 1){
    vec3 f = film(ndv*uIrid*1.7 + tuv.y*(PY > 0.5 ? 1.0 : 0.4) + tuv.x*(PW > 0.5 ? 1.0 : 0.25) + uTimeF*0.04);
    col = mix(col, f*mix(vec3(1.0), col*1.7, 0.35), 0.72);
    I *= 0.7 + 0.7*fres;
  } else if(st == 2){
    vec2 g = vUv*vec2(uGridN, floor(uGridN*0.5)) + vec2(0.0, -uTimeF*0.25);
    vec2 w = fwidth(g)*1.2*uPxScale;
    vec2 d = abs(fract(g + 0.5) - 0.5);
    vec2 l = 1.0 - smoothstep(vec2(0.0), w + 0.015, d);
    float line = max(l.x, l.y*0.8);
    I = I*0.22 + line*(0.55 + fres*1.2);
  } else {
    float f = fbmP(tuv*vec2(7.0, 4.0) + vec2(uTimeF*0.16, -uTimeF*0.11) + so, vec2(7.0*PW, 4.0*PY));
    float f2 = vnoiseP(tuv*vec2(6.0, 12.0) - vec2(uTimeF*0.14) + f*2.5, vec2(6.0*PW, 12.0*PY));
    col = mix(uC0, mix(uC2, uC3, f2), smoothstep(0.25, 0.75, f));
    col = mix(col, uC1, pow(f2, 3.0)*1.6);
    I *= 0.45 + f*1.5;
  }
  I += smoothstep(0.975, 1.0, vT)*uHead;
  I *= vA*uOpacity*uNorm;
  vec3 o = uInk > 0.5 ? (1.0 - col)*I*0.75 : col*I;
  gl_FragColor = vec4(clamp(o, vec3(0.0), vec3(32.0)), 1.0);
}
`;

const BRANE_VERT = /* glsl */`
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }
`;
const BRANE_FRAG = /* glsl */`
uniform vec3 uC0, uC2, uC3;
uniform float uTimeF, uInk, uSide;
varying vec2 vUv;
${GLSL_COMMON}
void main(){
  vec2 p = vUv*2.0 - 1.0;
  float f = vnoise(p*2.2 + vec2(uTimeF*0.08 + uSide*3.0, -uTimeF*0.05));
  float ring = 0.5 + 0.5*sin(length(p)*16.0 - uTimeF*1.2 + f*7.0);
  float m = max(abs(p.x), abs(p.y));
  float body = smoothstep(1.0, 0.55, m);
  float frame = smoothstep(0.975, 0.99, m)*smoothstep(1.0, 0.993, m);
  vec3 col = mix(uC0, uC2, f);
  col = mix(col, uC3, ring*0.35);
  float I = (0.05 + 0.13*ring*f)*body + frame*0.55;
  if(uInk > 0.5) gl_FragColor = vec4((1.0 - col)*I*0.6, 1.0);
  else gl_FragColor = vec4(col*I, 1.0);
}
`;

// One final pass: tone mapping, sRGB encode, aberration, vignette, grain, pixelation, dithering.
const FX = {
  uniforms: {
    tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 },
    uGrain: { value: 0 }, uAberr: { value: 0 }, uVig: { value: 0 }, uPixel: { value: 0 }, uDither: { value: 0 }, uLight: { value: 0 }, uFxScale: { value: 1 }, uAA: { value: 1 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime, uGrain, uAberr, uVig, uPixel, uDither, uLight, uFxScale, uAA;
varying vec2 vUv;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }
vec3 srgb(vec3 c){ c = clamp(c, 0.0, 1.0); return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
float bayer(vec2 p){
  ivec2 i = ivec2(mod(p, 4.0));
  int idx = i.x + i.y*4;
  float m[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
  return m[idx]/16.0;
}
void main(){
  vec2 uv = vUv;
  if(uPixel > 1.0){ vec2 cell = vec2(uPixel)/uRes; uv = (floor(uv/cell) + 0.5)*cell; }
  vec2 d = uv - 0.5;
  vec3 c;
  if(uAberr > 0.001){
    vec2 off = d*length(d)*uAberr*0.05;
    c = vec3(texture2D(tDiffuse, uv + off).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - off).b);
  } else {
    c = texture2D(tDiffuse, uv).rgb;
  }
  c = clamp(c, vec3(0.0), vec3(64.0));
  // Cheap edge smoothing: where local contrast is high, lean toward the neighbour average.
  if(uAA > 0.5){
    vec2 px = 1.0/uRes;
    vec3 a1 = min(texture2D(tDiffuse, uv + vec2(px.x, 0.0)).rgb, 64.0), a2 = min(texture2D(tDiffuse, uv - vec2(px.x, 0.0)).rgb, 64.0);
    vec3 a3 = min(texture2D(tDiffuse, uv + vec2(0.0, px.y)).rgb, 64.0), a4 = min(texture2D(tDiffuse, uv - vec2(0.0, px.y)).rgb, 64.0);
    vec3 Lw = vec3(0.2126, 0.7152, 0.0722);
    float l0 = dot(c/(1.0 + c), Lw), l1 = dot(a1/(1.0 + a1), Lw), l2 = dot(a2/(1.0 + a2), Lw), l3 = dot(a3/(1.0 + a3), Lw), l4 = dot(a4/(1.0 + a4), Lw);
    float con = max(max(max(l1, l2), max(l3, l4)), l0) - min(min(min(l1, l2), min(l3, l4)), l0);
    c = mix(c, max((a1 + a2 + a3 + a4)*0.25, 0.0), smoothstep(0.1, 0.4, con)*0.35);
  }
  // Black point: the faint far tail of bloom is cut to true black, so empty space stays pure black.
  if(uLight < 0.5) c = max(c - 0.004, 0.0)*1.004;
  c = srgb(uLight > 0.5 ? c : aces(c*1.05));
  float vig = smoothstep(0.8, 0.15, length(d)*1.15);
  c *= mix(1.0, mix(uLight > 0.5 ? 0.88 : 0.45, 1.0, vig), uVig);
  // On dark, grain only lands where there is light, so the background never fills with noise.
  float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float gmask = uLight > 0.5 ? 1.0 : smoothstep(0.0, 0.08, lum);
  c += (h(floor(gl_FragCoord.xy/uFxScale) + fract(uTime*7.13)*413.0) - 0.5)*uGrain*0.11*gmask;
  // Half-step dither on lit pixels removes 8-bit banding rings in soft glow.
  c += (h(gl_FragCoord.xy*1.37 + 17.0) - 0.5)/255.0*step(0.0005, lum);
  if(uDither > 0.5){
    vec2 bp = floor(gl_FragCoord.xy/max(uPixel, 2.0*uFxScale));
    c = floor(c*4.0 + bayer(bp))/4.0;
  }
  gl_FragColor = vec4(c, 1.0);
}`,
};

};

function gridGeometry(Useg, Vseg, maxInst) {
  const pos = new Float32Array((Useg + 1) * (Vseg + 1) * 3);
  const uv = new Float32Array((Useg + 1) * (Vseg + 1) * 2);
  const idx = new Uint32Array(Useg * Vseg * 6);
  let k = 0;
  for (let j = 0; j <= Vseg; j++) for (let i = 0; i <= Useg; i++) { uv[k++] = i / Useg; uv[k++] = j / Vseg; }
  k = 0;
  for (let j = 0; j < Vseg; j++) for (let i = 0; i < Useg; i++) {
    const a = j * (Useg + 1) + i, b = a + 1, c = a + Useg + 1, d = c + 1;
    idx[k++] = a; idx[k++] = c; idx[k++] = b; idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('aInst', new THREE.InstancedBufferAttribute(Float32Array.from({ length: maxInst }, (_, i) => i), 1));
  g.instanceCount = 1;
  g.userData.U = Useg; g.userData.V = Vseg;
  return g;
}

function applyBlend(m, ink) {
  m.blending = THREE.CustomBlending;
  m.blendEquation = ink ? THREE.ReverseSubtractEquation : THREE.AddEquation;
  m.blendSrc = THREE.OneFactor;
  m.blendDst = THREE.OneFactor;
}

const GEO = [

  gridGeometry(isSmall ? 44 : 76, isSmall ? 44 : 76, 49),
];
const meshes = GEO.map((g, i) => {
  const m = new THREE.ShaderMaterial({
    uniforms: U, vertexShader: VERT, fragmentShader: FRAG, defines: { SCENE: i },
    transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide,
  });
  applyBlend(m, false);
  const mesh = new THREE.Mesh(g, m);
  mesh.frustumCulled = false;
  mesh.visible = false;
  scene.add(mesh);
  return mesh;
});

const TUBE_VERT = /* glsl */`
uniform float uTau, uRadius, uAmpScale, uSpread, uHeight, uScale, uTubeR;
uniform float uAmp[8];

void main(){

  closed(uv.x*TAU, uTau, X, dS, dT);

  vec3 N = normalize(cross(T, vec3(0.0, 1.0, 0.0)) + vec3(1e-4, 0.0, 0.0));
  vec3 B = cross(T, N);

uniform vec3 uC0, uC1, uC2;
uniform float uHead, uOpacity, uInk, uTimeF, uAccent;
varying vec3 vN;
varying vec3 vV;
varying float vS;
void main(){

  float core = pow(clamp(abs(dot(N, V)), 0.0, 1.0), 3.0);
  float shimmer = 0.8 + 0.2*sin(vS*18.8496 + uTimeF*1.3);
  vec3 col = mix(uC1, vec3(1.0), core*0.7);

const dbSize = new THREE.Vector2();

const braneMats = [-1, 1].map(side => {

// After the first frame, each scene is drawn once into a tiny hidden target that matches the screen

  renderer.render(scene, camera);
  renderer.setRenderTarget(null);

  warmed.add(warmKey(S.scene));
  const step = () => {

    if (k === undefined) return;
    warmScene(k);

const DEVICE_DPR = devicePixelRatio || 1;
let quality = 1, qCeiling = 1, goodWindows = 0;

const sceneQuality = [null, null, null, null];
const frameTimes = [];

// Quality ladder: full -> lighter bloom -> fewer faint trail layers -> lower resolution (never below 1x).
function targetDPR() {
  const base = Math.min(DEVICE_DPR, recording ? 1.5 : 2);
  if (S.quality === 'sharp') return base;
  if (S.quality === 'fast') return Math.max(1, base * 0.65);
  return Math.max(1, base * (quality >= 0.6 ? 1 : quality >= 0.52 ? 0.8 : 0.65));
}
let curW = 0, curH = 0, curPR = 0;
function applySize(force) {

  curW = w; curH = h; curPR = pr;
  // MSAA is expensive on half-float targets and buys little for additive glow at 1.5x resolution,
  // so it is reserved for the Sharp setting.
  const samples = !isSmall && S.quality === 'sharp' ? 4 : 0;
  setMSAA(samples);

  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  if (quality < 0.95 && S.quality !== 'sharp') bloom.setSize(Math.round(w * pr * 0.5), Math.round(h * pr * 0.5));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  fxPass.uniforms.uRes.value.set(w * pr, h * pr);
  $('#statRes').textContent = `${Math.round(w * pr)}×${Math.round(h * pr)} · ${pr.toFixed(2)}×`;
  dirty = true;
}
function adapt(dt, now) {
  if (now < lastAdjust) return;
  frameTimes.push(dt);
  if (frameTimes.length < 40) return;
  const avg = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
  frameTimes.length = 0;
  $('#statFps').textContent = `${Math.round(1000 / avg)} fps`;
  if (S.quality !== 'auto' || recording) return;
  if (avg > 22) {
    goodWindows = 0;
    if (quality > 0.5 && now - lastAdjust > 800) {

      quality = Math.max(0.5, quality * 0.8);
      lastAdjust = now;

// Largest pixel ratio this GPU can render safely for the current window.
function exportPR(mode) {
  const w = innerWidth, h = innerHeight;
  const gl = renderer.getContext();
  const maxDim = Math.min(renderer.capabilities.maxTextureSize, gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), 8192);
  const capPx = isSmall ? 8e6 : 24e6;
  let pr = mode === 'screen' ? Math.max(curPR, Math.min(DEVICE_DPR, 2))
         : mode === '4k' ? 3840 / Math.max(w, h)
         : Infinity;
  pr = Math.min(pr, maxDim / w, maxDim / h, Math.sqrt(capPx / (w * h)));
  return Math.max(pr, 0.5);
}
function paintExport() {
  const pr = exportPR(exportMode);
  $('#exportDim').textContent = `${Math.floor(innerWidth * pr)}×${Math.floor(innerHeight * pr)}`;
  document.querySelectorAll('#exportSize button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === exportMode)));
}
document.querySelectorAll('#exportSize button').forEach((b, i) => b.addEventListener('click', () => {
  if (exportMode === b.dataset.v) return;
  exportMode = b.dataset.v;
  try { localStorage.setItem('string.exportSize', exportMode); } catch {}
  Sound.seg(i);
  paintExport();
}));

function setMSAA(n) {
  for (const t of [composer.renderTarget1, composer.renderTarget2]) {
    if (t.samples !== n) { t.samples = n; t.dispose(); }
  }
}
function exportImage() {
  if (wantCapture) return;
  Sound.shutter();
  const pr = exportPR(exportMode);
  if (pr > curPR * 1.2) toast(`Rendering ${Math.floor(innerWidth * pr)}×${Math.floor(innerHeight * pr)}…`);
  setTimeout(() => { wantCapture = true; dirty = true; }, 40);
}
// Renders one frame at export size in an offscreen pass. Bloom keeps its on-screen resolution and
// grain, dither and grid lines are scaled, so the file looks like the screen, only sharper.
function doCapture() {
  wantCapture = false;
  const w = innerWidth, h = innerHeight;
  const pr = exportPR(exportMode);
  const scale = pr / curPR;
  let blobPromise = null;
  try {
    setMSAA(0);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    bloom.setSize(Math.round(w * curPR), Math.round(h * curPR));
    fxPass.uniforms.uRes.value.set(w * pr, h * pr);
    U.uPxScale.value = scale;
    fxPass.uniforms.uFxScale.value = scale;
    syncUniforms();
    renderFrame();
    const W = renderer.domElement.width, H = renderer.domElement.height;
    blobPromise = new Promise(res => renderer.domElement.toBlob(b => res({ b, W, H }), 'image/png'));
  } catch (e) {
    toast('That size is too large for this device. Try 4K or Screen.');
  } finally {
    U.uPxScale.value = 1;
    fxPass.uniforms.uFxScale.value = 1;
    applySize(true);
    dirty = true;
    // The export frame is slow on purpose; keep it out of the auto-resolution measurements.
    frameTimes.length = 0;
    goodWindows = 0;
    lastAdjust = performance.now() + 2000;
  }
  if (!blobPromise) return;
  blobPromise.then(({ b, W, H }) => {
    if (!b) { toast('The browser could not encode the image. Try a smaller size.'); return; }
    const url = URL.createObjectURL(b);
    const img = new Image();
    img.src = url; img.alt = `Exported frame, ${W} by ${H} pixels`;
    const preset = (presetSel.selectedOptions[0]?.textContent || 'string').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const name = `string-${preset}-${W}x${H}.png`;
    const mb = (b.size / 1048576).toFixed(1);
    openModal(`Exported frame · ${W}×${H}`, img, `PNG, ${mb} MB. Download it, or right-click the image to save.`, async () => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
        toast('Image copied');
      } catch { toast('This browser blocked copying the image. Use Download instead.'); }
    }, 'Copy image', { url, name });
  });
}

let recording = false;
let recLen = (() => { try { return +localStorage.getItem('string.recLen') || 6; } catch { return 6; } })();
if (![6, 8, 10, 12].includes(recLen)) recLen = 6;
function paintRecLen() { $('#recLenSel').value = String(recLen); }
$('#recLenSel').addEventListener('change', e => {
  recLen = +e.target.value;
  try { localStorage.setItem('string.recLen', String(recLen)); } catch {}
  Sound.press();
});
function record() {
  if (recording) return;
  if (!canvas.captureStream || typeof MediaRecorder === 'undefined') { toast('This browser cannot record the canvas.'); return; }
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t));
  let rec;
  try { rec = new MediaRecorder(canvas.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 12e6 } : undefined); }
  catch { toast('Recording is not available here.'); return; }
  const chunks = [];
  const btn = $('#recBtn');
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    recording = false;
    applySize(true);
    btn.firstChild.textContent = 'Record ';
    $('#recLenSel').disabled = false;
    const blob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
    const v = document.createElement('video');
    v.src = URL.createObjectURL(blob); v.controls = true; v.loop = true; v.autoplay = true; v.muted = true; v.playsInline = true;
    const ext = (rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
    openModal(`${len}-second clip`, v, 'Download the clip, or right-click the video to save it.', null, null, { url: v.src, name: `string-clip.${ext}` });
  };
  recording = true;
  applySize(true);   // recording cap: at most 1.5x so the encoder never drops frames
  Sound.rec();
  const len = recLen;
  $('#recLenSel').disabled = true;
  btn.firstChild.textContent = `Recording ${len}s `;
  // Length is measured in real time from when the recorder actually starts, so a busy
  // machine (throttled timers, dropped frames) still produces a clip of the chosen length.
  let t0 = 0;
  rec.onstart = () => { t0 = performance.now(); };
  rec.start();
  const iv = setInterval(() => {
    if (!t0) return;
    const elapsed = (performance.now() - t0) / 1000;
    btn.firstChild.textContent = `Recording ${Math.max(0, Math.ceil(len - elapsed))}s `;
    if (elapsed >= len + 0.3) { clearInterval(iv); rec.stop(); }
  }, 200);
}

}
$('#notesToggle').addEventListener('click', () => { const open = notes.classList.contains('collapsed'); Sound.section(open); setNotes(open); });

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
  if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Escape' && root.classList.contains('zen')) { setZen(false); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowRight') loadPreset(presetIdx + 1, true);
  else if (e.key === 'ArrowLeft') loadPreset(presetIdx - 1, true);
  else if (k === 'r') randomize();
  else if (k === 'p') { Sound.toggle(paused); setPaused(!paused); }
  else if (k === 'e') exportImage();
  else if (k === 'v') record();
  else if (k === 'h') setPanel(panel.classList.contains('closed'));
  else if (k === 'x') resetView();
  else if (k === 't') toggleTheme();
  else if (k === 'f') setZen(!root.classList.contains('zen'));
  else if (k === 'm') toggleSound();
  else if (['1', '2', '3'].includes(k)) { const i = VISIBLE[+k - 1]; if (S.scene !== i) { setScene(i, true); Sound.scene(SCENES[i].root, S.amps); } }
  else return;
  e.preventDefault();
});

/* ================================================================== loop */

controls.addEventListener('change', () => { dirty = true; });
addEventListener('resize', () => { applySize(); paintExport(); });
document.addEventListener('visibilitychange', () => { frameTimes.length = 0; last = performance.now(); });

const motion = reduceMotion ? 0.35 : 1;
let last = performance.now();
let firstFrameMarked = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 15 && !wantCapture) return;   // ~60 fps cap, so 120 Hz screens don't double the GPU work
  const rawDt = now - last;
  last = now;
  const dt = Math.min(rawDt / 1000, 0.05);
  if (!paused) { tau += dt * S.tension * motion; timeF += dt * S.flow * motion; cyA += dt * S.cySpeed * motion; }
  controls.autoRotate = !paused && S.autoRotate !== 0 && !reduceMotion;
  controls.autoRotateSpeed = S.autoRotate * 2;
  controls.update();
  if (paused && !dirty && !wantCapture) return;
  dirty = false;
  syncUniforms();
  renderFrame();
  if (!firstFrameMarked) {
    firstFrameMarked = true;
    performance.mark('string:first-frame');
    const idle = window.requestIdleCallback || (f => setTimeout(f, 200));
    idle(() => precompileScenes());
  }
  if (wantCapture) doCapture();
  if (rawDt > 0 && rawDt < 250) adapt(rawDt, now);
}

buildPanel();
paintRecLen();
buildPresetSelect();
paintSound();
onTheme();
setNotes(false);
if (isSmall) setPanel(false);
applySize(true);
paintExport();
loadPreset(0, false);
requestAnimationFrame(frame);
</script>
